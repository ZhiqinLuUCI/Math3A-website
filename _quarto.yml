format:
  html:
    lang: en
    theme: cosmo
    # Versioned filename prevents GitHub Pages/browser caches from keeping an
    # older copy of the chapter-title design.
    css: styles-v3.css
    toc: true
    toc-depth: 3
    number-sections: false
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"
    include-in-header:
      - math-config.html
      - chapter-title.html
      - print-tools.html
    link-external-newwindow: false

<script>
document.addEventListener("DOMContentLoaded", () => {
  const title = document.querySelector("#title-block-header h1.title");
  if (!title) return;

  const match = title.textContent.trim().match(/^(\d+)\.\s+(.+)$/);
  if (!match) return;

  const [, number, name] = match;
  title.replaceChildren();

  const kicker = document.createElement("span");
  kicker.className = "chapter-kicker";
  kicker.textContent = "Chapter";

  const chapterNumber = document.createElement("span");
  chapterNumber.className = "chapter-number";
  chapterNumber.textContent = number;

  const chapterName = document.createElement("span");
  chapterName.className = "chapter-name";
  chapterName.textContent = name;

  title.append(kicker, chapterNumber, chapterName);
});
</script>
